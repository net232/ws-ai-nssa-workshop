<text x="105.0" y="178.0" font-size="12.5" font-weight="700" fill="#16191f" text-anchor="middle">Client EC2</text>
<text x="105.0" y="192.0" font-size="10.5" fill="#545b64" text-anchor="middle">test-matrix.sh (SSM)</text>
