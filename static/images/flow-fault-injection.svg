<text x="672" y="146" font-size="10.5" fill="#545b64" text-anchor="middle">TCP</text>
<circle cx="700" cy="185" r="12" fill="#ec7211" stroke="#ffffff" stroke-width="2"/>
<text x="700" y="189.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="250" cy="310" r="12" fill="#ec7211" stroke="#ffffff" stroke-width="2"/>
<text x="250" y="314.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="440" cy="310" r="12" fill="#ec7211" stroke="#ffffff" stroke-width="2"/>
<text x="440" y="314.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<circle cx="545" cy="128" r="12" fill="#ec7211" stroke="#ffffff" stroke-width="2"/>
<text x="545" y="132.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<rect x="20" y="362" width="920" height="28" fill="#232f3e"/>
<text x="28" y="381" font-size="12" font-weight="700" fill="#ffffff">#</text>
<text x="68" y="381" font-size="12" font-weight="700" fill="#ffffff">주입한 장애</text>
<text x="268" y="381" font-size="12" font-weight="700" fill="#ffffff">test-matrix 증상</text>
<text x="468" y="381" font-size="12" font-weight="700" fill="#ffffff">8443 대조군</text>
<text x="558" y="381" font-size="12" font-weight="700" fill="#ffffff">결정적 증거 (명령·로그)</text>
<rect x="20" y="390" width="920" height="52" fill="#ffffff" stroke="#e9ebed"/>
<circle cx="40" cy="416" r="12" fill="#ec7211" stroke="#ffffff" stroke-width="2"/>
<text x="40" y="420.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="68" y="421" font-size="11.5" fill="#16191f">target SG 8080 인바운드 제거</text>
<text x="268" y="421" font-size="11.5" fill="#16191f">정상 포함 전부 REJECT/ERROR</text>
<text x="468" y="421" font-size="11.5" fill="#d91515">실패</text>
<text x="558" y="421" font-size="11.5" fill="#16191f">target health unhealthy · 로그 Success일 수 있음 · Reachability Analyzer</text>
<rect x="20" y="442" width="920" height="52" fill="#f8f8f8" stroke="#e9ebed"/>
<circle cx="40" cy="468" r="12" fill="#ec7211" stroke="#ffffff" stroke-width="2"/>
<text x="40" y="472.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="68" y="473" font-size="11.5" fill="#16191f">CA 번들을 rogue CA로 교체</text>
<text x="268" y="473" font-size="11.5" fill="#16191f">valid 거부, other-ca가 통과</text>
<text x="468" y="473" font-size="11.5" fill="#1d8102">정상</text>
<text x="558" y="473" font-size="11.5" fill="#16191f">Failed:ClientCertUntrusted · 번들 subject·fingerprint 비교</text>
<rect x="20" y="494" width="920" height="52" fill="#ffffff" stroke="#e9ebed"/>
<circle cx="40" cy="520" r="12" fill="#ec7211" stroke="#ffffff" stroke-width="2"/>
<text x="40" y="524.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="68" y="525" font-size="11.5" fill="#16191f">정상 인증서를 폐기한 CRL 추가</text>
<text x="268" y="525" font-size="11.5" fill="#16191f">client-valid만 거부</text>
<text x="468" y="525" font-size="11.5" fill="#1d8102">정상</text>
<text x="558" y="525" font-size="11.5" fill="#16191f">Failed:ClientCertCrlHit · describe-trust-store-revocations</text>
<rect x="20" y="546" width="920" height="52" fill="#f8f8f8" stroke="#e9ebed"/>
<circle cx="40" cy="572" r="12" fill="#ec7211" stroke="#ffffff" stroke-width="2"/>
<text x="40" y="576.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="68" y="577" font-size="11.5" fill="#16191f">필터 값 오타 · 경로 대소문자</text>
<text x="268" y="577" font-size="11.5" fill="#16191f">Production·URI 인증서도 거부</text>
<text x="468" y="577" font-size="11.5" fill="#1d8102">정상</text>
<text x="558" y="577" font-size="11.5" fill="#16191f">Failed:CertificateFilterNoMatch · describe-listeners</text>
<text x="20" y="628" font-size="11" fill="#545b64">진단 원칙: 증상 재현(실패하는 명령 하나) → 가설 → 증거 수집 → 원인 확정 → 수정 → 같은 명령으로 재확인</text>
