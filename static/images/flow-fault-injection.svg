<text x="535.0" y="314.0" font-size="11" font-weight="700" fill="#16191f" text-anchor="middle">CRL crl.pem (revocation)</text>
<path d="M250,166 L240,166 L240,272" fill="none" stroke="#7aa116" stroke-width="1.4" stroke-dasharray="3 3"/>
<rect x="700" y="110" width="220" height="150" rx="8" fill="#ffffff" stroke="#d91515" stroke-dasharray="5 3"/>
<text x="712" y="128" font-size="11.5" font-weight="700" fill="#d91515">Target SG: TCP 8080 ← NLB SG</text>
