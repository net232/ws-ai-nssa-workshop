<text x="810.0" y="176.0" font-size="10.5" fill="#545b64" text-anchor="middle">AZ a · 8080</text>
<rect x="720" y="198" width="180" height="44" rx="7" fill="#ffffff" stroke="#8d99a8" stroke-dasharray="0"/>
<text x="810.0" y="220.0" font-size="12.5" font-weight="700" fill="#16191f" text-anchor="middle">backend B</text>
<text x="810.0" y="234.0" font-size="10.5" fill="#545b64" text-anchor="middle">AZ b · 8080</text>
