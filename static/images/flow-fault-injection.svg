<text x="340.0" y="168.0" font-size="10.5" fill="#545b64" text-anchor="middle">mTLS verify</text>
<rect x="250" y="198" width="180" height="46" rx="7" fill="#ffffff" stroke="#8d99a8" stroke-dasharray="4 3"/>
<text x="340.0" y="221.0" font-size="12.5" font-weight="700" fill="#16191f" text-anchor="middle">TLS :8443</text>
<text x="340.0" y="235.0" font-size="10.5" fill="#545b64" text-anchor="middle">mTLS off (대조군)</text>
