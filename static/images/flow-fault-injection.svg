<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Noto Sans CJK KR, Noto Sans KR, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
<title>Lab 4 장애 주입 지점</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#545b64"/></marker></defs>
<rect width="960" height="640" fill="#ffffff"/>
<text x="20" y="32" font-size="18" font-weight="700" fill="#16191f">Lab 4 장애 주입 지점 — 같은 "연결 실패"라도 증거가 다르다</text>
<text x="20" y="52" font-size="12" fill="#545b64">inject-fault.sh 가 아래 ①–④ 중 하나를 바꿉니다. 8443(mTLS off) 리스너는 대조군입니다.</text>
